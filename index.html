<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ფასადის სამუშაოები</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E7E9EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ფასადი">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
--bg:#E7E9EE;--sheet:#ffffff;--grp:#ffffff;--ink:#111317;--mute:#6b717b;
--chip:#E3E6EB;--sep:rgba(60,60,67,.16);--glass:rgba(247,248,250,.86);
--acc:#B3480A;--bgl:#c6cad1;
--ceil:#9b3fd1;--cer:#1E9E4A;--acm:#1E6FE0;--niche:#FF9800;--fac:#0f7a5a;--now:#FF6A13}

*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Noto Sans Georgian",sans-serif;overflow-x:clip}
.viewer{position:relative;height:100vh;height:100dvh;min-height:480px}
.plan{position:absolute;inset:0;overflow:hidden;touch-action:none}
.plan svg{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.glass{position:absolute;z-index:2;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:.5px solid var(--sep);box-shadow:0 2px 14px rgba(0,0,0,.07)}
.nav{left:10px;right:10px;top:max(10px,env(safe-area-inset-top));height:58px;border-radius:29px;display:flex;align-items:center;padding:0 6px 0 18px;gap:2px}
.nav .t{flex:1;overflow:hidden}
.nav .t b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .t span{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;padding:0;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-radius:10px}
.ib{width:44px;height:44px;border-radius:50%}
.ib:active,.tb:active{background:var(--chip)}
.ib svg,.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tools{left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));height:56px;border-radius:28px;display:flex;align-items:center;padding:0 6px;gap:2px;max-width:calc(100% - 20px)}
.tools .sep{width:1px;height:26px;background:var(--sep);margin:0 6px;flex:none}
.tb{height:44px;padding:0 10px;border-radius:22px;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ink)}
.menu{position:absolute;z-index:5;min-width:220px;max-width:calc(100% - 20px);max-height:60vh;overflow:auto;border-radius:16px;padding:6px 0;display:none}
.menu.on{display:block}
.menu button{width:100%;justify-content:flex-start;padding:0 16px;gap:12px;min-height:44px;font-size:16px;border-radius:0}
.menu button+button{border-top:.5px solid var(--sep)}
.menu button::after{content:"";margin-left:auto;width:16px}
.menu button[aria-pressed=true]::after{content:"✓";color:var(--acc);font-weight:600}
.menu .hd{font-size:12.5px;color:var(--mute);padding:8px 16px 4px}
.menu input[type=month]{margin:4px 12px 10px;width:calc(100% - 24px);font:inherit;font-size:16px;border:0;border-radius:10px;background:var(--chip);color:var(--ink);padding:10px 12px}
.toast{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 66px);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid var(--sep);padding:8px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.sheetbg{fill:var(--sheet);stroke:var(--sep);stroke-width:.6}
.bg{stroke:var(--bgl);stroke-width:.25;fill:none}
.pb{fill:none;stroke:var(--bgl);stroke-width:.5;stroke-dasharray:3 2}
.pl{font:600 18px -apple-system,sans-serif;fill:var(--mute)}
.el{cursor:pointer}
.ln .v{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.1;opacity:.3}
.ln .h{fill:none;stroke:transparent;stroke-width:18px;vector-effect:non-scaling-stroke}
.ln.d .v{opacity:1;stroke-width:1.9}
.ln.n .v{opacity:1;stroke-width:2.2;filter:drop-shadow(0 0 1.2px var(--now)) drop-shadow(0 0 1.2px var(--now))}
.mk .v{stroke-width:.6;opacity:.5}.mk .h{fill:transparent;stroke:none}
.mk.n .v{stroke:var(--now);stroke-width:1}
.off{opacity:.15;pointer-events:none}
main{padding:18px 14px 56px;max-width:900px;margin:0 auto}
.gh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;padding:22px 16px 7px;font-size:13px;color:var(--mute)}
.gh b{font-weight:400}
.grp{background:var(--grp);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px}
.li+.li{border-top:.5px solid var(--sep)}
.li .n{flex:1}
.li .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.li .s{display:none;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:6.5em;text-align:right}
.lnk{color:var(--acc);font-size:15px;min-height:32px}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:2px;margin:12px 0 0}
.seg button{flex:1;min-height:32px;border-radius:7px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:500}
.tw{background:var(--grp);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px;border-bottom:.5px solid var(--sep);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left}
th{font-size:12.5px;color:var(--mute);font-weight:400}
tr.bk td{font-weight:600}
tr.pr{cursor:pointer}tr.pr:active{background:var(--chip)}
td small{color:var(--mute);font-size:12.5px}
.foot{font-size:12.5px;color:var(--mute);padding:7px 16px 0}
pre{background:var(--grp);border-radius:12px;padding:14px 16px;margin:0;font:inherit;font-size:15px;line-height:1.55;white-space:pre-wrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#bulk button{color:var(--acc);font-size:14px;min-height:32px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;padding:24px;z-index:9}
.dlg.on{display:flex}.dlg>div{background:var(--glass);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;max-width:300px;width:100%;text-align:center;overflow:hidden}
#dlgt{padding:18px 16px;font-size:15px}
.dlg .row{gap:0;flex-wrap:nowrap;border-top:.5px solid var(--sep)}.dlg .row button{flex:1;color:var(--acc);min-height:44px}
.dlg .row button+button{border-left:.5px solid var(--sep);font-weight:600}
.hide{display:none!important}
@media(max-width:600px){table{font-size:13px}th,td{padding:8px 8px}.nav .t span{font-size:12px}.tb{padding:0 8px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}

.nav{height:auto;min-height:58px;flex-wrap:wrap;padding:7px 8px 7px 18px;gap:8px 10px}
.seg.sm{margin:0}.seg.sm button{min-height:34px;padding:0 12px;flex:none}
.mon{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.mon input{font:inherit;font-size:15px;color:var(--ink);border:0;border-radius:9px;background:var(--chip);padding:6px 10px;min-height:36px}
.chip{background:var(--chip);border-radius:10px;height:36px;min-height:36px;padding:0 12px;font-size:14px}
.chip svg{width:18px;height:18px}
.tools{height:auto;min-height:56px;padding:6px 8px;border-radius:22px;flex-wrap:wrap;justify-content:center;gap:6px;left:0;right:0;margin:0 auto;width:max-content;transform:none}
.grpb{display:flex;align-items:center;gap:2px}
.seg.lay{margin:0}.seg.lay button{flex:none;min-height:34px;padding:0 11px;gap:6px;font-size:14px}
.legend{left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 74px);border-radius:12px;padding:6px 10px;display:flex;gap:12px;font-size:12.5px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:5px}
.lg{width:14px;height:10px;border-radius:3px;display:inline-block}
#mpart{left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 70px)}
.li{flex-wrap:wrap;row-gap:6px}
.li .bar{flex-basis:100%;height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin-left:24px}
.li .bar i{display:block;height:100%;border-radius:3px}
.li .sub2{flex-basis:100%;margin-left:24px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
@media(max-width:820px){.nav .t{flex-basis:100%}.nav .t span{display:none}.tools{left:8px;right:8px;transform:none;max-width:none;width:auto;margin:0}.tools .sep{display:none}.seg.lay{order:-1;flex-basis:100%;flex-wrap:wrap;justify-content:center}.grpb{flex:1;justify-content:center}.legend{top:calc(max(10px,env(safe-area-inset-top)) + 118px)}.toast{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 140px)}#mpart{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 120px)}}
@media(max-width:420px){.seg.lay button{padding:0 8px;font-size:13px}.legend{font-size:11.5px;gap:8px}}
.del{color:#D12E2E}
.pg polygon{fill:var(--c);fill-opacity:.1;stroke:var(--c);stroke-opacity:.55;stroke-width:.35}
.pg.d polygon{fill-opacity:.55;stroke-opacity:1}
.pg.n polygon{fill-opacity:1;stroke:var(--now);stroke-opacity:1;stroke-width:1}
.ln .v{stroke:var(--c)}.ln.dash .v{stroke-dasharray:2 1}
.mk .v{stroke:var(--c);fill:var(--sheet)}.mk.d .v{opacity:1;fill:var(--c)}
.l0{background:rgba(127,127,127,.08);border:1px solid var(--c);opacity:.6}
.l1{background:var(--c);opacity:.55;border:1px solid var(--c)}
.l2{background:var(--c);border:1.5px solid var(--now)}
.back{margin-left:-12px;flex:none}
@media(max-width:820px){.nav .t{flex-basis:calc(100% - 72px)}}
@media(max-width:420px){.mon span{display:none}.mon input{padding:6px 6px;font-size:14px}}
.home{max-width:640px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 14px 40px}
.home h1{font-size:28px;font-weight:700;margin:14px 16px 4px}
.home p{color:var(--mute);font-size:14px;margin:0 16px 18px}
.home a{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:60px;color:var(--ink);text-decoration:none}
.home a+a{border-top:.5px solid var(--sep)}
.home a:active{background:var(--chip)}
.home a .n{flex:1}.home a b{display:block;font-weight:600}.home a span{display:block;font-size:13px;color:var(--mute)}
.home a i{color:var(--mute);font-style:normal;font-size:20px}
.home .tag{background:var(--chip);border-radius:9px;padding:3px 9px;font-size:12.5px;color:var(--mute);white-space:nowrap}

</style>
</head>
<body>
<div class="home hide" id="home">
 <h1>ფასადის სამუშაოები</h1>
 <p>აირჩიეთ პროექტი</p>
 <div class="grp" id="plist"></div>
 <div class="foot">თითოეული პროექტის მონიშვნები ინახება ცალ-ცალკე, ამ მოწყობილობაზე.</div>
</div>
<div id="app" class="hide">
<div class="viewer">
<div class="plan" id="plan"><svg id="svg" role="img" aria-label="ნახაზი"></svg></div>
<div class="glass nav">
 <a class="ib back" href="./" aria-label="პროექტები" style="color:var(--ink)"><svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="m15 5-7 7 7 7"/></svg></a>
 <div class="t"><b id="ttl"></b><span id="sub"></span></div>
 <label class="mon"><span>თვე</span><input type="month" id="mon"></label>
 <button class="tb chip" id="tostats"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>ჯამები</span></button>
</div>
<div class="glass legend" id="legend"><span><i class="lg l0"></i>დარჩა</span><span><i class="lg l1"></i>დამონტაჟდა</span><span><i class="lg l2"></i>ამ თვეში</span></div>
<div class="glass tools" id="bottombar">
 <div class="grpb">
  <button class="ib" id="pprev" aria-label="წინა ნაწილი"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
  <button class="tb chip" id="bpart" aria-label="ნაწილი"><span id="partlbl">მთლიანი</span><svg viewBox="0 0 24 24" style="width:14px;height:14px"><path d="m6 9 6 6 6-6"/></svg></button>
  <button class="ib" id="pnext" aria-label="შემდეგი ნაწილი"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
 </div>
 <span class="sep"></span>
 <div class="seg lay" id="layers" role="group" aria-label="რას ვნიშნავ"></div>
 <span class="sep"></span>
 <div class="grpb">
  <button class="ib" id="zout" aria-label="დაპატარავება"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button class="ib" id="zin" aria-label="გადიდება"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="zfit" aria-label="მთლიანი ნახაზი"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="ib" id="undo" aria-label="დაბრუნება"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="ib del" id="clrall" aria-label="ყველა მონიშვნის წაშლა"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
 </div>
</div>
<div class="glass menu" id="mpart"><div class="hd">ნაწილი</div><div id="partsbar"></div></div>
<div class="toast" id="toast"></div>
</div>
<main id="stats">
 <div class="gh"><b id="kh">ამ თვეში</b></div>
 <div class="grp" id="kpis"></div>
 <div class="gh"><b>ნაწილების მიხედვით</b><span id="bulk"></span></div>
 <div class="seg" id="ptype" style="margin:0 0 8px"></div>
 <div class="tw"><table id="tbl"></table></div>
 <div class="gh"><b id="rh">ანგარიში</b><button class="lnk" id="copy">კოპირება</button></div>
 <pre id="rep"></pre>
 <div class="gh"><b>მონიშვნები</b></div>
 <div class="grp"><button class="li lnk del" id="clrall2" style="width:100%;justify-content:flex-start">ყველა მონიშვნის წაშლა</button></div>
 <div class="gh"><b>სარეზერვო ასლი</b></div>
 <div class="grp"><button class="li lnk" id="bk" style="width:100%;justify-content:flex-start">ასლის ჩამოტვირთვა</button><button class="li lnk" id="rsb" style="width:100%;justify-content:flex-start">ასლიდან აღდგენა</button><input type="file" id="rs" accept="application/json,.json" hidden></div>
 <div class="foot">მონიშვნები ინახება ამ ტელეფონზე/პლანშეტზე. თვის ბოლოს ჩამოტვირთეთ ასლი.</div>
 <div class="foot" id="save" aria-live="polite"></div>
</main>
</div>
<div class="dlg" id="dlg"><div><div id="dlgt"></div><div class="row"><button id="dno">გაუქმება</button><button id="dyes">დიახ</button></div></div></div>
<script>
(async()=>{
const $=id=>document.getElementById(id);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!window.__rl){window.__rl=1;location.reload()}})}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pid=new URLSearchParams(location.search).get('p');
let LIST=[];try{LIST=await (await fetch('projects/index.json')).json()}catch(e){}
const proj=LIST.find(x=>x.id===pid);
// ---- project list
if(!proj){
 $('home').classList.remove('hide');document.title='ფასადის სამუშაოები';
 $('plist').innerHTML=LIST.map(p=>`<a href="?p=${encodeURIComponent(p.id)}"><span class="n"><b>${esc(p.title)}</b><span>${esc(p.sub||'')}</span></span><span class="tag" data-k="${esc(p.id)}"></span><i>›</i></a>`).join('')||'<div class="li">პროექტები ვერ ჩაიტვირთა. შეამოწმეთ ინტერნეტი.</div>';
 LIST.forEach(p=>{let n=0;try{n=Object.keys((JSON.parse(localStorage.getItem(p.key)||'{}').done)||{}).length}catch(e){}const el=$('plist').querySelector(`[data-k="${CSS.escape(p.id)}"]`);if(el){if(n)el.textContent=n+' მონიშნული';else el.remove()}});
 return}
let P;try{P=await (await fetch('projects/'+pid+'.json')).json()}catch(e){document.body.innerHTML='<div class="home"><h1>ვერ ჩაიტვირთა</h1><p>შეამოწმეთ ინტერნეტი და სცადეთ თავიდან.</p><div class="grp"><a href="./">‹ პროექტები</a></div></div>';return}
$('app').classList.remove('hide');
const C=P.cfg,D={els:P.els,parts:P.parts},BG=P.bg,KEY=C.key;
document.title=C.title;$('ttl').textContent=C.title;$('sub').textContent=C.sub||'';
let ST={done:{}};
try{const l=localStorage.getItem(KEY);if(l)ST=JSON.parse(l)}catch(e){}
let FIRST=false;try{FIRST=!localStorage.getItem(KEY)}catch(e){}
const CAT={},SHAPE={};for(const[t,[c,s]]of Object.entries(C.types)){CAT[t]=c;SHAPE[t]=s}
const CATS=C.cats.map(x=>x[0]);const CN={},CS={},CC={};C.cats.forEach(([k,n,s,c])=>{CN[k]=n;CS[k]=s;CC[k]=c});
const PARTS=C.blocks.flatMap(b=>b[2]);const BN={};C.blocks.forEach(b=>b[2].forEach(p=>BN[p]=b[1]));
const pname=p=>(C.pnames&&C.pnames[p])||p;
const fmt=v=>v.toFixed(1).replace('.',',');
const now=new Date(); const mon=$('mon'); mon.value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
let layer=C.all?'all':CATS[0],ptype=CATS[0],undoStack=[];
const K=id=>'L1:'+id;
const byId={}; D.els.forEach(e=>byId[e.id]=e);
// ---- svg build
const svg=$('svg');
const [X0,Y0,W0,H0]=C.view;
let vb={x:X0,y:Y0,w:W0,h:H0};
const setVB=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
let html=`<rect class="sheetbg" x="${X0-3*W0}" y="${Y0-3*H0}" width="${7*W0}" height="${7*H0}"/><path class="bg" d="${BG}"/>`;
for(const p of PARTS){const q=D.parts[p];if(q)html+=`<polygon class="pb" points="${q.poly.map(a=>a.join(',')).join(' ')}"/>`}
const ordS={poly:0,dash:1,line:2,win:3,niche:4};
[...D.els].sort((a,b)=>ordS[SHAPE[a.t]]-ordS[SHAPE[b.t]]).forEach(e=>{
 const pts=e.g.map(a=>a.join(',')).join(' '),sh=SHAPE[e.t],st=`style="--c:${CC[CAT[e.t]]}"`;
 if(sh==='poly') html+=`<g class="el pg" ${st} data-id="${e.id}"><polygon points="${pts}"/></g>`;
 else if(sh==='win'||sh==='niche'){const [x,y]=e.g[0];const s=sh==='win'?2.2:2.6;
  html+=`<g class="el mk" ${st} data-id="${e.id}">${sh==='win'?`<rect class="v" x="${x-s}" y="${y-s}" width="${2*s}" height="${2*s}" rx="${s}"/>`:`<path class="v" d="M${x} ${y-s}L${x+s} ${y}L${x} ${y+s}L${x-s} ${y}Z"/>`}<circle class="h" cx="${x}" cy="${y}" r="7"/></g>`}
 else html+=`<g class="el ln${sh==='dash'?' dash':''}" ${st} data-id="${e.id}"><polyline class="v" points="${pts}"/><polyline class="h" points="${pts}"/></g>`;
});
for(const p of PARTS){const l=C.labels&&C.labels[p];if(l)html+=`<text class="pl" x="${l[0]}" y="${l[1]}">${p}</text>`}
svg.innerHTML=html; setVB();
const G={}; svg.querySelectorAll('.el').forEach(g=>G[g.dataset.id]=g);
// ---- layers
const conic='conic-gradient('+CATS.map((c,i)=>`${CC[c]} 0 ${Math.round((i+1)/CATS.length*100)}%`).join(',')+')';
const LAY=[...(C.all?[['all','ყველა']]:[]),...C.cats.map(c=>[c[0],c[2]])];
const setLegend=()=>$('legend').style.setProperty('--c',CC[layer==='all'?CATS[0]:layer]);
$('layers').innerHTML=LAY.map(([k,n])=>`<button data-l="${k}" aria-pressed="${k===layer}"><span class="dot" style="background:${k==='all'?conic:CC[k]}"></span>${esc(n)}</button>`).join('');
$('layers').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;layer=b.dataset.l;$('layers').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));setLegend();paint();renderBulk()});
setLegend();
let focusPart=null;
$('partsbar').innerHTML=['All',...PARTS].map(p=>`<button data-p="${p}" aria-pressed="${p==='All'}">${p==='All'?'მთლიანი ნახაზი':esc(pname(p))}</button>`).join('');
$('partsbar').addEventListener('click',e=>{const b=e.target.closest('button');if(b){zoomPart(b.dataset.p);setTimeout(()=>{closeMenus();syncLbl()},0)}});
function zoomPart(p){focusPart=p==='All'?null:p;$('partsbar').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.p===p));
 if(!focusPart){fitView(X0,Y0,W0,H0)}else{const xs=D.parts[p].poly.map(a=>a[0]),ys=D.parts[p].poly.map(a=>a[1]);const m=8;
  let x=Math.min(...xs)-m,y=Math.min(...ys)-m,w=Math.max(...xs)-x+m,h=Math.max(...ys)-y+m;fitView(x,y,w,h)}
 setVB();renderBulk()}
function fitView(x,y,w,h){const r=svg.getBoundingClientRect(),tb=document.querySelector('.nav').getBoundingClientRect(),bb=$('bottombar').getBoundingClientRect(),lg=$('legend').getBoundingClientRect();const padT=(Math.max(tb.bottom,lg.bottom)-r.top+8),padB=(r.bottom-bb.top+8),avail=Math.max(r.height-padT-padB,100),s=Math.max(w/r.width,h/avail);const vw=r.width*s,vh=r.height*s;vb={x:x-(vw-w)/2,y:y-padT*s-(avail*s-h)/2,w:vw,h:vh}}
// ---- paint
function paint(){const m=mon.value;
 for(const e of D.els){const g=G[e.id],d=ST.done[K(e.id)];g.classList.toggle('d',!!d&&d!==m);g.classList.toggle('n',d===m);g.classList.toggle('off',layer!=='all'&&CAT[e.t]!==layer)}
 renderNums()}
// ---- numbers
const Z=()=>({s:0,d:0,n:0});
const add=(a,x)=>{a.s+=x.s;a.d+=x.d;a.n+=x.n;return a};
function sums(){const m=mon.value,S={};
 for(const e of D.els){const c=CAT[e.t],k=e.p+'|'+c;S[k]=S[k]||Z();S[k].s+=e.a;const d=ST.done[K(e.id)];if(d&&d<=m)S[k].d+=e.a;if(d===m)S[k].n+=e.a}
 return S}
function renderNums(){const S=sums(),m=mon.value;const MK=['იანვარი','თებერვალი','მარტი','აპრილი','მაისი','ივნისი','ივლისი','აგვისტო','სექტემბერი','ოქტომბერი','ნოემბერი','დეკემბერი'];const mname=MK[+m.slice(5,7)-1]+' '+m.slice(0,4);
 $('kh').textContent=mname;$('rh').textContent='ანგარიში, '+mname;
 const g=(p,c)=>S[p+'|'+c]||Z();
 const tot=c=>PARTS.reduce((a,p)=>add(a,g(p,c)),Z());
 $('kpis').innerHTML=CATS.map(c=>{const t=tot(c),pc=t.s?t.d/t.s*100:0;return`<div class="li"><span class="dot" style="background:${CC[c]}"></span><span class="n">${esc(CN[c])}</span><span class="v"><b>${fmt(t.n)}</b> მ² ამ თვეში</span><div class="bar"><i style="width:${pc.toFixed(1)}%;background:${CC[c]}"></i></div><div class="sub2">სულ დამონტაჟებული ${fmt(t.d)} / ${fmt(t.s)} მ² · ${Math.round(pc)}%</div></div>`}).join('');
 const pc=v=>v.s?Math.round(v.d/v.s*100)+'%':'–';const cell=v=>`<td>${v.n?'<b>'+fmt(v.n)+'</b>':'–'}</td><td>${fmt(v.d)} <small>/ ${fmt(v.s)}</small></td><td><small>${pc(v)}</small></td>`;const c=ptype;
 let h=`<tr><th></th><th>ამ თვეში</th><th>სულ / მოცულობა, მ²</th><th></th></tr>`;
 for(const [,bn,ps] of C.blocks){
  h+=`<tr class="bk"><td>${esc(bn)}</td>${cell(ps.reduce((a,p)=>add(a,g(p,c)),Z()))}</tr>`;
  for(const p of ps)h+=`<tr class="pr" data-p="${p}"><td>${p}</td>${cell(g(p,c))}</tr>`}
 $('tbl').innerHTML=h;
 let r='';for(const [,bn,ps] of C.blocks){for(const p of ps){r+=`${bn} – ${p} ნაწილი\n`;for(const c of CATS)r+=`${CN[c]} — ${fmt(g(p,c).n)} მ²\n`;r+='\n'}}
 $('rep').textContent=r+'სულ ამ თვეში\n'+CATS.map(c=>`${CN[c]} — ${fmt(tot(c).n)} მ²`).join('\n');
}
$('ptype').innerHTML=C.cats.map(([k,,n])=>`<button data-t="${k}" aria-pressed="${k===ptype}">${esc(n)}</button>`).join('');
$('ptype').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ptype=b.dataset.t;$('ptype').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderNums()});
$('tbl').addEventListener('click',e=>{const tr=e.target.closest('tr.pr');if(tr){zoomPart(tr.dataset.p);syncLbl();$('plan').scrollIntoView({behavior:'smooth',block:'center'})}});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('rep').textContent);toast('ანგარიში დაკოპირდა')}catch(e){toast('მონიშნეთ ტექსტი და დააკოპირეთ')}});
mon.addEventListener('change',()=>{closeMenus();paint();renderBulk()});
// ---- toggling
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}
function setMany(ids,val){const prev={};ids.forEach(id=>{prev[id]=ST.done[id]||null;if(val)ST.done[id]=val;else delete ST.done[id]});undoStack.push(prev);if(undoStack.length>50)undoStack.shift();paint();queueSave()}
function tapEl(id){const e=byId[id],m=mon.value,d=ST.done[K(id)];
 if(d&&d!==m){toast(`ჩაწერილია ${d}-ში. შესაცვლელად აირჩიეთ ის თვე.`);return}
 setMany([K(id)],d?null:m);toast(`${e.p} · ${CN[CAT[e.t]]} · ${fmt(e.a)} მ² ${d?'მოიხსნა':'დაემატა'}`)}
$('undo').addEventListener('click',()=>{const u=undoStack.pop();if(!u){toast('გასაუქმებელი არაფერია');return}for(const[k,v]of Object.entries(u)){if(v)ST.done[k]=v;else delete ST.done[k]}paint();queueSave();toast('გაუქმდა')});
// ---- bulk
const lname=()=>(LAY.find(x=>x[0]===layer)||['',''])[1];
function renderBulk(){const b=$('bulk');if(!focusPart||layer==='all'){b.innerHTML='<span style="font-size:12.5px">აირჩიეთ ნაწილი და ტიპი სწრაფი მონიშვნისთვის</span>';return}
 b.innerHTML=`<button id="ball">${focusPart}: ყველას მონიშვნა</button><button id="bclr">ამ თვის გასუფთავება</button>`;
 const ids=D.els.filter(e=>e.p===focusPart&&CAT[e.t]===layer).map(e=>K(e.id));
 $('ball').onclick=()=>ask(`${focusPart}-ში ყველა „${lname()}“ მოინიშნოს დამონტაჟებულად – ${mon.value}?`,()=>setMany(ids.filter(i=>!ST.done[i]),mon.value));
 $('bclr').onclick=()=>ask(`წაიშალოს ${focusPart}-ის „${lname()}“ მონიშვნები (${mon.value})?`,()=>setMany(ids.filter(i=>ST.done[i]===mon.value),null))}
function ask(t,fn){$('dlgt').textContent=t;$('dlg').classList.add('on');$('dyes').onclick=()=>{$('dlg').classList.remove('on');fn()};$('dno').onclick=()=>$('dlg').classList.remove('on')}
// ---- pan / zoom / tap
const pts=new Map();let start=null,moved=false,downId=null;
const toSvg=(cx,cy)=>{const r=svg.getBoundingClientRect(),s=Math.max(vb.w/r.width,vb.h/r.height),ox=(r.width*s-vb.w)/2,oy=(r.height*s-vb.h)/2;return{x:vb.x-ox+(cx-r.left)*s,y:vb.y-oy+(cy-r.top)*s,s}};
function zoomAt(cx,cy,f){const p=toSvg(cx,cy);const nw=Math.min(Math.max(vb.w*f,20),W0*1.6);const k=nw/vb.w;vb={x:p.x-(p.x-vb.x)*k,y:p.y-(p.y-vb.y)*k,w:nw,h:vb.h*k};setVB()}
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pts.size===1){start={x:e.clientX,y:e.clientY,vb:{...vb}};moved=false;const g=e.target.closest&&e.target.closest('.el');downId=g&&!g.classList.contains('off')?g.dataset.id:null}else{downId=null;moved=true}});
svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const old=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pts.size===1&&start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>7)moved=true;if(moved){const s=toSvg(0,0).s;vb={...start.vb,x:start.vb.x-dx*s,y:start.vb.y-dy*s};setVB()}}
 else if(pts.size===2){const [a,b]=[...pts.values()];const o=[...pts.entries()].find(([k])=>k!==e.pointerId)[1];
  const d1=Math.hypot(old.x-o.x,old.y-o.y),d2=Math.hypot(a.x-b.x,a.y-b.y);if(d1>0&&d2>0){zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d1/d2)}
  const s=toSvg(0,0).s;vb.x-=(e.clientX-old.x)*s/2;vb.y-=(e.clientY-old.y)*s/2;setVB()}});
const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(pts.size===0){if(!moved&&downId)tapEl(downId);start=null;downId=null}else{start=null}};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*0.0015))},{passive:false});
$('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,0.7)};
$('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/0.7)};
const clearAll=()=>{const n=Object.keys(ST.done).length;if(!n){toast('მონიშვნები არ არის');return}
 ask(`წაიშალოს ამ პროექტის ყველა მონიშვნა (${n} ელემენტი)? შემდეგ შეგიძლიათ დააბრუნოთ ↶ ღილაკით.`,()=>{const prev={};for(const k of Object.keys(ST.done))prev[k]=ST.done[k];undoStack.push(prev);ST.done={};paint();queueSave();toast('ყველა მონიშვნა წაიშალა')})};
$('clrall').onclick=clearAll;$('clrall2').onclick=clearAll;
$('zfit').onclick=()=>{zoomPart('All');syncLbl()};
const MENUS=['mpart'];
const closeMenus=x=>MENUS.forEach(m=>{if(m!==x)$(m).classList.remove('on')});
function layout(){const nb=document.querySelector('.nav').getBoundingClientRect(),bb=$('bottombar').getBoundingClientRect();$('legend').style.top=(nb.bottom+6)+'px';$('toast').style.bottom=(innerHeight-bb.top+10)+'px'}
addEventListener('resize',layout);layout();
const toggleMenu=m=>{closeMenus(m);const bb=$('bottombar').getBoundingClientRect();$(m).style.bottom=(innerHeight-bb.top+8)+'px';$(m).classList.toggle('on')};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu')&&!e.target.closest('#bpart'))closeMenus()},true);
$('bpart').onclick=()=>toggleMenu('mpart');
$('layers').addEventListener('click',()=>setTimeout(()=>{closeMenus();syncLbl()},0));
const PL=['All',...PARTS];
const stepPart=d=>{const i=PL.indexOf(focusPart||'All');zoomPart(PL[(i+d+PL.length)%PL.length]);syncLbl()};
$('pprev').onclick=()=>stepPart(-1);$('pnext').onclick=()=>stepPart(1);
function syncLbl(){$('partlbl').textContent=focusPart||'მთლიანი';renderNums()}
$('tostats').onclick=()=>$('stats').scrollIntoView({behavior:'smooth'});
// ---- saving
function status(t){$('save').textContent=t}
function queueSave(){try{localStorage.setItem(KEY,JSON.stringify(ST));status('შენახულია ამ მოწყობილობაზე')}catch(e){status('ვერ შეინახა – ჩამოტვირთეთ ასლი')}}
if(FIRST&&!Object.keys(ST.done).length&&C.seed){ST={done:{...C.seed.done}};queueSave()}
$('bk').onclick=()=>{const b=new Blob([JSON.stringify({project:pid,...ST},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=pid+'-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('rsb').onclick=()=>$('rs').click();
$('rs').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j||typeof j.done!=='object')throw 0;if(j.project&&j.project!==pid){toast('ეს ასლი სხვა პროექტისაა');e.target.value='';return}
 ask(`ამ პროექტის მონიშვნები შეიცვალოს ასლით (${Object.keys(j.done).length} ელემენტი)?`,()=>{const prev={};for(const k of new Set([...Object.keys(ST.done),...Object.keys(j.done)]))prev[k]=ST.done[k]||null;undoStack.push(prev);ST={done:{...j.done}};paint();queueSave();toast('ასლი აღდგა')})}catch(_){toast('ეს ფაილი ასლი არ არის')}e.target.value=''};
requestAnimationFrame(()=>{layout();fitView(X0,Y0,W0,H0);setVB()});addEventListener('resize',()=>{if(!focusPart){fitView(X0,Y0,W0,H0);setVB()}});
paint();renderBulk();
status('შენახულია ამ მოწყობილობაზე');
})();
</script>
</body>
